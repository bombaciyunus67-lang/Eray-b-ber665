name: Build OnStep ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 2.0.17 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Build ESP32 Firmware
        run: |
          set -e
          rm -rf OnStep build_out
          mkdir -p OnStep build_out

          INO_FILE=$(find . -maxdepth 4 -not -path './OnStep/*' -not -path './build_out/*' -name "OnStep.ino" -print -quit)
          if [ -z "$INO_FILE" ]; then
            INO_FILE=$(find . -maxdepth 4 -not -path './OnStep/*' -not -path './build_out/*' -name "*.ino" -print -quit)
          fi

          if [ -z "$INO_FILE" ]; then
            echo "NO_INO_FOUND"
            ls -la
            exit 1
          fi

          INO_DIR=$(dirname "$INO_FILE")
          echo "Found sketch: $INO_FILE in $INO_DIR"

          if [ "$INO_DIR" = "." ]; then
            find . -maxdepth 1 -not -name '.git' -not -name '.github' -not -name 'OnStep' -not -name 'build_out' -exec cp -r {} OnStep/ \;
          else
            cp -r "$INO_DIR"/* OnStep/
          fi

          if [ ! -f "OnStep/OnStep.ino" ]; then
            mv "OnStep/$(basename "$INO_FILE")" "OnStep/OnStep.ino"
          fi

          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build_out OnStep/OnStep.ino

      - name: Upload BIN artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onstep-esp32-bin
          path: build_out/*.bin
          if-no-files-found: ignore





          
