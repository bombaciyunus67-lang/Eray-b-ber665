name: Build OnStep ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 2.0.17 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Compile OnStep
        run: |
          mkdir -p build_out
          SKETCH_PATH=$(find . -name "OnStep.ino" -print -quit)
          echo "Compiling sketch found at: $SKETCH_PATH"
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build_out "$SKETCH_PATH"

      - name: Upload BIN artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onstep-esp32-bin
          path: build_out/*.bin
          if-no-files-found: ignore


          
