name: Build OnStep ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize OnStep Workspace
        run: |
          mkdir -p /tmp/onstep_ws
          shopt -s dotglob
          for item in *; do
            if [ "$item" != ".github" ] && [ "$item" != "build_out" ]; then
              cp -r "$item" /tmp/onstep_ws/
            fi
          done

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 2.0.17 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Compile OnStep
        run: |
          mkdir -p build_out
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build_out /tmp/onstep_ws/OnStep.ino

      - name: Upload BIN artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onstep-esp32-bin
          path: build_out/*.bin
          if-no-files-found: ignore
          
