name: Build OnStep ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 2.0.17 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Build ESP32 Firmware
        run: |
          set -e
          rm -rf /tmp/derleme build_out
          mkdir -p /tmp/derleme build_out

          cp -r . /tmp/derleme/
          rm -rf /tmp/derleme/.git /tmp/derleme/.github /tmp/derleme/build_out

          INO_FILE=$(find /tmp/derleme -maxdepth 4 -name "OnStep.ino" -print -quit)
          if [ -z "$INO_FILE" ]; then
            INO_FILE=$(find /tmp/derleme -maxdepth 4 -name "*.ino" -print -quit)
          fi

          if [ -z "$INO_FILE" ]; then
            echo "INO dosyasi bulunamadi!"
            exit 1
          fi

          SKETCH_DIR=$(dirname "$INO_FILE")
          if [ "$SKETCH_DIR" != "/tmp/derleme" ]; then
            mv "$INO_FILE" /tmp/derleme/OnStep.ino
          fi

          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build_out /tmp/derleme/OnStep.ino

      - name: Upload BIN artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onstep-esp32-bin
          path: build_out/*.bin
          if-no-files-found: ignore

